<!doctype html>
<html><head><meta charset="utf-8"><title>Lingofy dub test</title><link rel="icon" href="data:,">
<style>body{font-family:sans-serif;max-width:760px;margin:2em auto}video{width:100%;background:#000}#bar{height:10px;background:#eee}#fill{height:10px;background:#4caf50;width:0%}</style>
</head><body>
<h1>Lingofy dub test</h1>
<p>Upload mp4/mov/webm, pick direction, Dub. Plays from the first dubbed chunk with the full timeline, like streaming.</p>
<input type="file" id="f" accept="video/*,audio/*" />
<select id="dir"><option value="en-hi">EN → HI</option><option value="hi-en">HI → EN</option></select>
<button onclick="go()">Dub</button>
<div id="st"></div><div id="bar"><div id="fill"></div></div>
<div id="spk" style="font-weight:bold"></div>
<div><label><input type="checkbox" id="dubbed" checked> Dubbed audio</label> <span style="color:#888">(uncheck for original audio)</span></div>
<div id="cost" style="font-size:small;color:#888"></div>
<video id="v" controls></video>
<pre id="m"></pre>
<script>
let sid=null,total=0,totalS=0,timer=null,ms=null,sb=null,msUrl=null,origUrl=null,segments=[],nextN=0,appending=false;
async function go(){
  const dir=document.getElementById('dir').value.split('-');
  const s=await (await fetch('/v1/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_lang:dir[0],target_lang:dir[1]})})).json();
  sid=s.session_id;
  const fd=new FormData(); fd.append('file', document.getElementById('f').files[0]);
  const u=await (await fetch('/v1/sessions/'+sid+'/video',{method:'POST',body:fd})).json();
  total=u.chunks_total; totalS=u.total_s||total*8;
  document.getElementById('st').textContent='buffering first chunk…';
  await fetch('/v1/sessions/'+sid+'/dub',{method:'POST'});
  startMSE();
  pollMeta();
  timer=setInterval(pollMeta,2000);
}
let pending=[];
let wantN=0;
async function startMSE(){
  try{
    ms=new MediaSource();
    const v=document.getElementById('v');
    msUrl=URL.createObjectURL(ms);
    v.src=msUrl;
    await new Promise(res=>{ms.addEventListener('sourceopen',res,{once:true});});
    ms.duration=totalS;
    sb=ms.addSourceBuffer('video/mp4; codecs="avc1.42C01F, mp4a.40.2"');
    sb.addEventListener('updateend',pump);
    // dub chunk 0 (creates init + first media), then stream from the top
    const j0=await (await fetch('/v1/sessions/'+sid+'/chunk/0')).json();
    if(j0.done||!j0.mse_url) throw new Error('empty');
    const ibuf=await (await fetch(j0.mse_init)).arrayBuffer();
    pending.push({buf:ibuf,off:0,init:true});
    doAppend();
    v.play().catch(()=>{});
  }catch(e){ legacyFallback(); }
}
function pump(){
  appending=false;
  if(pending.length){ doAppend(); return; }
  if(wantN<total){ const n=wantN; wantN++; fetchChunk(n); }
}
function doAppend(){
  if(!pending.length||!sb||sb.updating) return;
  const it=pending.shift();
  try{ if(!it.init) sb.timestampOffset=it.off; appending=true; sb.appendBuffer(it.buf); }
  catch(e){ pending.unshift(it); setTimeout(pump,500); }
}
async function fetchChunk(n){
  if(n>=total) return;
  const j=await (await fetch('/v1/sessions/'+sid+'/chunk/'+n)).json();
  if(j.done||!j.mse_url) return;
  const buf=await (await fetch(j.mse_url)).arrayBuffer();
  pending.push({buf:buf,off:j.start});
  if(j.speaker) document.getElementById('spk').textContent='Speaking now: Speaker '+j.speaker+(j.gender&&j.gender!=='unknown'?' ('+j.gender+')':'');
  document.getElementById('fill').style.width=Math.round(100*n/total)+'%';
  document.getElementById('st').textContent='playing chunk '+(n+1)+'/'+total+' — rest rendering ahead';
  doAppend();
}
async function pollMeta(){
  const st=await (await fetch('/v1/sessions/'+sid+'/status')).json();
  fetch('/v1/cost').then(r=>r.json()).then(c=>{
    document.getElementById('cost').textContent='spent so far: ₹'+c.chirp_inr+' ('+c.chirp_calls+' Chirp calls, '+c.chirp_audio_min+' min audio)';
  }).catch(()=>{});
  if(st.error){document.getElementById('st').textContent='error: '+st.error;clearInterval(timer);return;}
  if(st.video_url&&st.chunks_done>=st.chunks_total&&st.chunks_total>0){
    clearInterval(timer);
    const m=await (await fetch('/v1/sessions/'+sid+'/manifest')).json();
    segments=m.segments||[]; origUrl=m.orig_url;
    document.getElementById('m').textContent=JSON.stringify({speakers:m.speakers,chunks:total},null,2);
  }
}
async function legacyFallback(){
  const v=document.getElementById('v');
  let n=0;
  while(true){
    const j=await (await fetch('/v1/sessions/'+sid+'/chunk/'+n)).json();
    if(j.done) break;
    v.src=j.url+'?t='+Date.now();
    document.getElementById('st').textContent='playing chunk '+(n+1)+'/'+total+' (fallback mode)';
    try{await v.play();}catch(e){}
    await new Promise(r=>{v.onended=r;});
    n++;
  }
}
document.getElementById('v').addEventListener('timeupdate',e=>{
  if(!segments.length) return;
  const t=e.target.currentTime, s=segments.find(x=>t>=x.start&&t<x.end);
  if(s) document.getElementById('spk').textContent='Speaking now: Speaker '+s.speaker+' ('+s.gender+')';
});
document.getElementById('dubbed').addEventListener('change',e=>{
  const v=document.getElementById('v'); if(!v.src) return;
  const t=v.currentTime, wasPaused=v.paused;
  if(e.target.checked&&msUrl){ v.src=msUrl; }
  else if(origUrl){ v.src=origUrl+'?t='+Date.now(); }
  v.addEventListener('loadedmetadata',()=>{try{v.currentTime=Math.min(t,v.duration||t);}catch(_){} if(!wasPaused) v.play().catch(()=>{});},{once:true});
});
</script>
</body></html>
