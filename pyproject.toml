[project]
name = "lingofy"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# BLE001/S110/S112: the codebase uses broad fallbacks deliberately —
# every paid/local provider call degrades to the next option rather than
# failing the chunk. S110 = silent fallback to mock/offline.
ignore = ["BLE001", "S110", "S112"]

[tool.ruff.lint.isort]
known-first-party = ["services", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
