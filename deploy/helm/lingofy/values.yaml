# Default values. Override per env with -f values-dev.yaml / values-demo.yaml.
global:
  # ECR registry prefix, e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com/lingofy
  # Empty = local tags (lingofy-full:dev) for kind/k3d.
  registry: ""

images:
  full: # gateway + inline dub worker (same image, different CMD later)
    repository: "lingofy-full"
    tag: "dev"
    pullPolicy: IfNotPresent
  assembler:
    repository: "lingofy-assembler"
    tag: "dev"
    pullPolicy: IfNotPresent

gateway:
  replicas: 1  # keep 1: sessions live in memory (SQLite-on-PVC story in plan)
  servicePort: 80
  containerPort: 8080
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: "4", memory: 6Gi }
  # Optional paid-provider keys live in a K8s Secret, never in git.
  # create with: kubectl create secret generic lingofy-providers \
  #   --from-literal=GOOGLE_CLOUD_PROJECT=... (see templates/secret.yaml)
  useProviderSecret: false

assembler:
  replicas: 1
  pollInterval: "10"  # ASSEMBLE_POLL_S
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# Phase-2 queue worker (SQS). Off until the app speaks SQS (see plan.md roadmap).
dubWorker:
  enabled: false
  replicas: 1
  queueLength: 5
  minReplicas: 1
  maxReplicas: 8
  cooldownPeriod: 120

persistence:
  enabled: true
  size: 20Gi
  storageClass: ""  # "" = cluster default (EBS gp3 on EKS, local-path on k3d)

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  cpuUtilization: 70

ingress:
  enabled: false
  host: "lingofy.local"

observability:
  scrapeAnnotations: true  # prometheus.io/scrape for /metrics
