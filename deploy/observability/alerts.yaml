groups:
  - name: lingofy-mvp
    interval: 30s
    rules:
      # SLOBurn proxy: backlog exists AND nothing completes for 10m —
      # worker wedged (OOM/crash) or provider storm. Normal dubbing always
      # increments chunks_done, so this stays silent on the happy path.
      - alert: SLOBurn
        expr: (lingofy_chunks_total_total - lingofy_chunks_done_total) > 0 and deriv(lingofy_chunks_done_total[10m]) <= 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Dub backlog not draining for 5m"
      # Cost guard: Sarvam TTS spend should stay small per demo.
      # the piper fallback keeps playback working if keys throttle.
      - alert: PaidPathUsed
        expr: lingofy_sarvam_inr_est_total > 50
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Sarvam TTS spend over ₹50 — verify usage intent"
